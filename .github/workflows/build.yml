name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run loader, version, and package tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  synthesis:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        variant: [standard, discrete, special, expansion, vrc7, fds]
    steps:
      - uses: actions/checkout@v4
      - name: Compile FPGA image
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p "$RUNNER_TEMP/quartus-build"
          docker run --rm --platform linux/amd64 --cpus 3 --memory 3g \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/quartus-build,target=/build" \
            ghcr.io/drizzt/quartus@sha256:b5b0f0b7af271a0b9e9adc0cad59ff773d8690742a1426500fd71056d2c09787 \
            bash /source/tools/build.sh "$VARIANT"
      - name: Save compiler results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.variant }}
          path: ${{ runner.temp }}/quartus-build/results/
          if-no-files-found: error

  packaging:
    if: github.event_name == 'workflow_dispatch'
    needs: synthesis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set package build date
        run: python3 tools/stamp_version.py
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: build-results
      - name: Prepare compiler manifest
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          results = Path('build-results')
          for folder in results.glob('image-*'):
              folder.rename(results / folder.name.removeprefix('image-'))
          hashes = {p.as_posix(): sha256(p.read_bytes()).hexdigest()
                    for folder in ('rtl', 'target', 'platform', 'projects', 'generated')
                    for p in Path(folder).rglob('*') if p.is_file()}
          for name in ('tools/build.sh', 'tools/configure_variant.py', 'mapper_manifest.json'):
              hashes[name] = sha256(Path(name).read_bytes()).hexdigest()
          (results / 'source-manifest.json').write_text(json.dumps(hashes, indent=2) + '\n')
          PY
      - name: Package all six images
        run: python3 tools/package.py --source . --results build-results --output release
      - name: Save installable core
        uses: actions/upload-artifact@v4
        with:
          name: groucho.NES_experimental
          path: release/groucho.NES_experimental_*.zip
          if-no-files-found: error
